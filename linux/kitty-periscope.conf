# Add to ~/.config/kitty/kitty.conf  (include kitty-periscope.conf)
# Background-only transparency: device 1 shows through, your text stays 100% sharp.
background_opacity 0.55
dynamic_background_opacity yes
# Adjust live: Ctrl+Shift+A then M (more opaque) / L (less) / 1 (solid) / D (back to 0.55)
hide_window_decorations yes
