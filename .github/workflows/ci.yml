name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tools and e2e dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q just shellcheck xvfb openbox mpv ffmpeg socat wmctrl xdotool \
            x11-utils x11-apps xfonts-base xclip
      - run: just lint
      - run: just test
      - run: just e2e
      - run: just dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: PowerShell scripts parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Path windows, install -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { $bad++; Write-Host ("{0}:{1} {2}" -f $_.Name, $e.Extent.StartLineNumber, $e.Message) }
          }
          if ($bad) { exit 1 }
      - run: go test ./...
      - name: Build the release files the installer downloads
        shell: bash
        run: |
          mkdir dist
          CGO_ENABLED=0 go build -ldflags "-X main.version=ci" -o dist/periscope_windows_amd64.exe ./cmd/periscope
          cp assets/periscope.ico dist/
          cd dist && sha256sum periscope_windows_amd64.exe > SHA256SUMS
      - name: ffmpeg with SRT
        shell: powershell
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          if (-not (ffmpeg -hide_banner -protocols | Select-String -Pattern '^\s*srt$')) { throw "this ffmpeg has no SRT support" }
      - name: install.ps1 end to end, then stream a test pattern into an SRT listener
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $srv = Start-Process -FilePath python -ArgumentList "-m","http.server","8765","--directory","dist" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:PERISCOPE_DOWNLOAD_BASE = "http://127.0.0.1:8765"
          & .\install\install.ps1 -Role send -TargetHost 127.0.0.1 -Port 9000 -Passphrase 'abcdefghij12345'
          $exe = "$env:LOCALAPPDATA\periscope\bin\periscope.exe"

          & $exe send status
          if ($LASTEXITCODE -ne 0) { throw "the install did not start the sender" }
          if (Get-ScheduledTask -TaskName PeriscopeSender -ErrorAction SilentlyContinue) { throw "a logon autostart task exists" }
          $conhost = Join-Path $env:SystemRoot "System32\conhost.exe"

          # Switch to the test pattern and run a viewer stand-in: ffmpeg as the SRT listener.
          & $exe send stop
          & $exe config set send.capture test
          $listen = Start-Process -FilePath ffmpeg -PassThru -WindowStyle Hidden -ArgumentList @(
            "-hide_banner", "-loglevel", "error", "-i",
            "srt://0.0.0.0:9000?mode=listener&latency=80000&pbkeylen=16&passphrase=abcdefghij12345",
            "-t", "20", "-f", "null", "-")
          Start-Sleep -Seconds 2
          Start-Process -FilePath $conhost -ArgumentList "--headless `"$exe`" send start"
          $streaming = $false
          for ($i = 0; $i -lt 30 -and -not $streaming; $i++) {
            Start-Sleep -Seconds 1
            $s = & $exe send status
            $streaming = ($s -match "streaming to")
          }
          & $exe send status
          Get-Content "$env:LOCALAPPDATA\periscope\sender.log" -Tail 15
          if (-not $streaming) { throw "the sender never reported streaming" }

          & $exe send stop
          $left = $true
          for ($i = 0; $i -lt 10 -and $left; $i++) {
            Start-Sleep -Seconds 1
            $left = Get-CimInstance Win32_Process -Filter "Name = 'ffmpeg.exe'" |
                    Where-Object { $_.CommandLine -like "*service_name=periscope*" }
          }
          if ($left) { $left | Format-Table ProcessId, ParentProcessId, CommandLine -Wrap; throw "ffmpeg outlived the sender" }

          # Start Menu shortcuts (no hotkey): the toggle one starts and then stops the sender.
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Periscope"
          Get-ChildItem $menu | Select-Object -ExpandProperty Name
          $toggle = Join-Path $menu "Periscope - Start or stop sender.lnk"
          $hotkey = (New-Object -ComObject WScript.Shell).CreateShortcut($toggle).Hotkey
          if ($hotkey) { throw "the toggle shortcut has a hotkey: '$hotkey'" }
          $icon = (New-Object -ComObject WScript.Shell).CreateShortcut($toggle).IconLocation
          if ($icon -notmatch "periscope\.ico") { throw "the shortcut icon is '$icon'" }
          Start-Process -FilePath $toggle
          $up = $false
          for ($i = 0; $i -lt 15 -and -not $up; $i++) { Start-Sleep -Seconds 1; & $exe send status | Out-Null; $up = ($LASTEXITCODE -eq 0) }
          if (-not $up) { throw "the toggle shortcut did not start the sender" }
          Start-Process -FilePath $toggle
          $down = $false
          for ($i = 0; $i -lt 15 -and -not $down; $i++) { Start-Sleep -Seconds 1; & $exe send status | Out-Null; $down = ($LASTEXITCODE -ne 0) }
          if (-not $down) { throw "the toggle shortcut did not stop the sender" }
          # Uninstall: the Start menu entry exists, then one command removes everything (the program
          # folder a few seconds after exit, since Windows keeps a running exe).
          if (-not (Test-Path (Join-Path $menu "Periscope - Uninstall.lnk"))) { throw "no uninstall shortcut" }
          & $exe uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:LOCALAPPDATA\periscope"); $i++) { Start-Sleep -Seconds 1 }
          foreach ($p in "$env:LOCALAPPDATA\periscope", "$env:APPDATA\periscope", $menu) {
            if (Test-Path $p) { Get-ChildItem -Recurse $p | Select-Object -ExpandProperty FullName; throw "uninstall left $p" }
          }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -like "*periscope*") { throw "uninstall left the PATH entry" }
          Stop-Process -Id $listen.Id, $srv.Id -ErrorAction SilentlyContinue
          # The runner exits with the last native exit code: the final `send status` is 1 on purpose.
          exit 0
      - name: Desktop capture probe (informational)
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "ddagrab=output_idx=0:framerate=5,hwdownload,format=bgra" -frames:v 3 -f null -
          "ddagrab exit code: $LASTEXITCODE"
